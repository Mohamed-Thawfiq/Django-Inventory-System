{% extends 'base.html'  %}   
{% block content %} 
<center>   
<h1>All Products</h1>
</center>
<a href="/inventory/product/">
    <button>Add Product</button>
</a>
 
<table>
<thead>
    <tr>
        <th>Product Name</th>
        <th>Price</th>
        <th>Description</th>
        <th>Tax</th>
        <th>Food Type</th>
        <th>Update</th>
        <th>Delete</th>
    </tr>
</thead>

<tbody>
    {% for i in all_product %}
        <tr>
            <td>{{ i.product_name }} </td>
            <td>{{i.price}}</td>
            <td>{{i.product_description}}</td>
            <td>{{i.tax}}</td>
            <td>{{ i.food_type|yesno:"Yes,No" }}</td>
            <td>
                <a href="{% url 'product_update' i.id %}"><button>Update</button></a>
            </td>
            <td>
                <a href="{% url 'product_delete' i.id %}"><button>Delete</button></a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
    
</table>
    {% endblock %}
