{% extends 'base.html' %}

{% block title %}Product Form{% endblock %}

{% block content %}
<div class="page-card mx-auto" style="max-width:780px;">
    <div class="page-header">
        <h1>Product Form</h1>
        <a href="/inventory/product/view/" class="btn btn-outline-secondary">Back</a>
    </div>

    <form action="" method="POST" enctype="multipart/form-data" class="form-card">
        {% csrf_token %}
        {{ product_form }}
        <button type="submit" class="btn btn-primary">Save Product</button>
    </form>
</div>
{% endblock %}
