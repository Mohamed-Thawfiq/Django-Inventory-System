<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Login</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body { background-color: #f8f9fa; }
            .card-signin { border: 0; border-radius: 0.75rem; box-shadow: 0 0.5rem 1.2rem rgba(0,0,0,.1); }
        </style>
    </head>
    <body>
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="card card-signin">
                        <div class="card-body p-4">
                            <h3 class="card-title text-center mb-4">Login</h3>

                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
                                {% endfor %}
                            {% endif %}

                            <form method="post" action="" >
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label for="id_username" class="form-label">Username</label>
                                    <input type="text" name="username" class="form-control" id="id_username" placeholder="Enter Your Name" required>
                                </div>
                                

                                 <div class="mb-3">
                                    <label for="id_first_name" class="form-label">First Name</label>
                                    <input type="text" name="firstname" class="form-control" id="id_first_name" placeholder="Enter Your Name" required>
                                </div>
                                 <div class="mb-3">
                                    <label for="id_last_name" class="form-label">Last Name</label>
                                    <input type="text" name="lastname" class="form-control" id="id_last_name" placeholder="Enter Your Name" required>
                                </div>
                                 <div class="mb-3">
                                    <label for="id_email" class="form-label">Email Address</label>
                                    <input type="email" name="email" class="form-control" id="id_email" placeholder="Enter Your Email Address" required>
                                </div>

                                <div class="mb-3">
                                    <label for="id_password" class="form-label">Password</label>
                                    <input type="password" name="password" class="form-control" id="id_password" placeholder="Password" required>
                                </div>

                                 <div class="mb-3">
                                    <label for="id_age" class="form-label">Age</label>
                                    <input type="number" name="age" class="form-control" id="id_age" placeholder="Enter Your age" required>
                                </div>

                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="id_remember" name="remember">
                                    <label class="form-check-label" for="id_remember">Remember me</label>
                                </div>
                                {%  if error %}
                                <p class="alert alert-danger fw-bold role='alert'">{{error}}</p>
                                {% endif %}
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">signup</button>
                                </div>
                            </form>

                            <hr class="my-4">
                            <p class="text-center mb-0">Did You Have An Account <a href="/">Login</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
