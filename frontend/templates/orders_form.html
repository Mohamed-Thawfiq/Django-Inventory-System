{% extends 'base.html' %}

{% block title %}Add Order{% endblock %}

{% block content %}
<div class="page-card mx-auto" style="max-width:780px;">
    <div class="page-header">
        <h1>New Order</h1>
        <a href="/orders/view_orders/" class="btn btn-outline-secondary">View Orders</a>
    </div>

    <form action="" method="post" class="form-card">
        {% csrf_token %}
        {{ order_form }}
        <button type="submit" class="btn btn-primary">Save Order</button>
    </form>
</div>
{% endblock %}
