{% extends 'base.html' %}

{% block title %}Add Customer{% endblock %}

{% block content %}
<div class="page-card mx-auto" style="max-width:760px;">
    <div class="page-header">
        <h1>Add Customer</h1>
        <a href="/orders/all/customers/" class="btn btn-outline-secondary">Back</a>
    </div>

    <form method="post" class="form-card">
        {% csrf_token %}
        {{ customer_form }}
        <button type="submit" class="btn btn-primary">Add Customer</button>
    </form>
</div>
{% endblock %}
